name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # version commits and tags
  pull-requests: write # the "Version packages" PR
  id-token: write # npm trusted publishing + provenance

jobs:
  release:
    # off until the first version is published by hand and npm trusted publishing is set up (RELEASING.md),
    # so pushes to main don't fail trying to publish without npm access
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # trusted publishing (OIDC, no token) needs npm >= 11.5
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      # pending changesets: open/update the "Version packages" PR.
      # once that PR lands: publish (pnpm publish applies publishConfig, so dist ships, not src).
      # changesets/action v2 goes with @changesets/cli v3; v1 reads v3's .changeset/pre/ folder as a broken changeset.
      - uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: "Version packages"
          commit-message: "chore: version packages"
          create-github-releases: true
        env:
          NPM_CONFIG_PROVENANCE: "true"
